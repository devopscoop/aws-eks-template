# Based on:
# https://github.com/opentofu/setup-opentofu

# When we create a pull request (PR) to the main branch, this workflow runs `tofu plan`, and adds the output as a comment to the PR. If the plan looks good, we merge (ie. push) the code to the main branch. On push to main, this runs a `tofu apply`.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/opentofu-aws-eks.yml
      - .github/scripts/guard-node-group-removal.sh
      - cluster/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/opentofu-aws-eks.yml
      - .github/scripts/guard-node-group-removal.sh
      - cluster/**
defaults:
  run:
    working-directory: cluster
# Every run, plan or apply, takes the lock on the same state file, so
# overlapping runs (e.g. Dependabot opening several PRs at once) fail with
# "Error acquiring the state lock". Run them one at a time instead. The default
# `queue: single` keeps only one run pending and cancels the rest; `max` queues
# up to 100 in FIFO order. Never cancel in progress: killing a run mid-apply
# can leave the state locked or half-applied.
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#concurrency
concurrency:
  group: opentofu-aws-eks-state
  queue: max
  cancel-in-progress: false
permissions:
  id-token: write
  contents: read
  pull-requests: write
jobs:
  opentofu:
    runs-on: ubuntu-latest
    # This is a template repo; the cluster isn't real here, so don't run against
    # it. Repos created from the template have a different name, so the workflow
    # runs normally for them.
    if: github.repository != 'devopscoop/aws-eks-template'
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          # This will be overwritten with the correct region by quickstart.sh.
          aws-region: us-east-2
          # This must be manually updated to our actual ARN.
          role-to-assume: arn:aws:iam::999999999999:role/github-actions-dev-tf-Role-REDACTED
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          # Prefer `tofu_version_file` over `tofu_version`, because the version file ensures that both local and workflow runs are locked to the same version.
          # Path is resolved relative to the repo root (GITHUB_WORKSPACE), not the job's working-directory.
          tofu_version_file: cluster/.opentofu-version
      # https://github.com/magnetikonline/terraform-github-action-cache-example
      - name: Configure Terraform plugin cache
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >>"$GITHUB_ENV"
          mkdir --parents "$HOME/.terraform.d/plugin-cache"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-${{ runner.os }}-
      - id: fmt
        run: tofu fmt -recursive -check
        continue-on-error: true
      - id: init
        run: tofu init
      - id: validate
        run: tofu validate -no-color
      - id: plan
        # Write plan output directly to file via tee rather than capturing to a step output variable.
        # Passing large plan output (e.g. many destroys) via ${{ steps.plan.outputs.stdout }} in an
        # env var triggers "Argument list too long" (ARG_MAX) when printf/bash tries to expand it.
        run: tofu plan -concise -no-color -input=false -out=plan.file 2>&1 | tee plan-output.txt; exit "${PIPESTATUS[0]}"
        # We need to continue-on-error here so we can print the tofu plan output even on failure.
        continue-on-error: true
      # Refuse to remove a node group that still has a database on it. An
      # instance_types change replaces the group, and EKS terminates a deleted
      # group's nodes a few minutes later regardless of PodDisruptionBudgets,
      # which can take a database down. The script
      # looks for PVC-backed EBS volumes still attached to the removed groups'
      # instances (CI cannot reach the private API endpoint to list pods) and
      # explains the rest in its header. continue-on-error so the PR comment
      # below can carry the report; on main, "Check node group guard result"
      # stops the apply.
      - id: guard
        name: Node group guard
        if: steps.plan.outcome == 'success'
        run: '"$GITHUB_WORKSPACE/.github/scripts/guard-node-group-removal.sh" plan.file'
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: tofu-plan-output
          path: cluster/plan-output.txt
          retention-days: 7
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        if: github.event_name == 'pull_request'
        # zizmor's template-injection audit flagged interpolating `${{ ... }}`
        # expressions directly into the inline `script:` below. GitHub expands
        # those expressions into the script's source before Node runs it, so an
        # attacker-controlled value (e.g. github.actor, a branch name, or plan
        # output) could break out of a string and execute arbitrary JavaScript.
        # We pass the values as environment variables here and read them via
        # `process.env.*` in the script, where they're treated as inert data
        # rather than code. See https://docs.zizmor.sh/audits/#template-injection
        env:
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          TF_WORKING_DIR: cluster
          WORKFLOW: ${{ github.workflow }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const wd = path.join(process.env.GITHUB_WORKSPACE, process.env.TF_WORKING_DIR);
            const planOutput = fs.readFileSync(path.join(wd, 'plan-output.txt'), 'utf8');
            // The node group guard's report. The step is skipped when the plan
            // failed, and fails (continue-on-error) when a group this plan
            // removes still has a database on it or the check itself errored.
            const guardPath = path.join(wd, 'node-group-guard.txt');
            const guardReport = fs.existsSync(guardPath) ? fs.readFileSync(guardPath, 'utf8').trim() : '';
            const guardSection = process.env.GUARD_OUTCOME === 'failure'
              ? [
                  `#### :no_entry: Node group guard \`failure\``,
                  'This plan removes a node group that still has a database on it, or the guard could not check. **The apply on main will refuse to run** until the database has been moved (`docs/changing-instance-types.md`).',
                  `\`\`\`\n${guardReport}\n\`\`\``,
                ].join('\n\n')
              : `#### Node group guard \`${process.env.GUARD_OUTCOME}\``;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // GitHub PR comments are capped at 65536 chars. Leave ~2000 for the surrounding template.
            const PLAN_LIMIT = 63000;
            const planSection = planOutput.length > PLAN_LIMIT
              ? `Plan output too large for a comment ([download from workflow artifacts](${runUrl}))`
              : `<details><summary>Show Plan</summary>\n\n\`\`\`tofu\n\n${planOutput}\n\`\`\`\n\n</details>`;
            const output = [
              `#### OpenTofu Format and Style \`${process.env.FMT_OUTCOME}\``,
              `#### OpenTofu Plan \`${process.env.PLAN_OUTCOME}\``,
              guardSection,
              planSection,
              `*Pusher: @${process.env.ACTOR}, Action: \`${process.env.EVENT_NAME}\`, Working Directory: \`${process.env.TF_WORKING_DIR}\`, Workflow: \`${process.env.WORKFLOW}\`*`,
            ].join('\n\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });
      # We need the workflow to show as failed when the plan fails, so we're breaking it here.
      - name: Check plan result
        if: steps.plan.outcome == 'failure'
        run: exit 1
      # Fail closed on main: the guard found a database on a node group this
      # plan would remove, or could not evaluate the plan at all. On a PR the
      # finding is only reported in the comment above, so a reviewer can still
      # see the plan.
      - name: Check node group guard result
        if: github.ref == 'refs/heads/main' && steps.guard.outcome != 'success'
        run: |
          cat node-group-guard.txt 2>/dev/null || true
          exit 1
      - if: github.ref == 'refs/heads/main'
        run: tofu apply -concise -no-color -input=false plan.file
