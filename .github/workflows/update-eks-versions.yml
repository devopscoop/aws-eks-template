# Keeps the version pins in cluster/terraform.tfvars from going stale silently.
#
# Two different problems, so two jobs. The AMI release and the EKS add-on
# builds move every few weeks within one Kubernetes minor, carry no ordering
# constraints, and are exactly what the update_*.sh scripts already compute —
# so those become a pull request, which is strictly more useful than a
# notification: the opentofu workflow posts a `tofu plan` on it, so the node
# rotation an AMI bump implies is visible before anyone approves it.
#
# A new Kubernetes minor is not that. It needs upgrade insights reviewed, it
# goes control plane first and add-ons last (see the AWS upgrade order in
# docs.aws.amazon.com/eks/latest/userguide/update-cluster.html), and it is one
# minor at a time. That gets an issue to pick up deliberately, not a PR to
# merge.
name: Update EKS versions

on:
  schedule:
    # Mondays, deliberately off the hour: scheduled workflows all fire late
    # when the top of the hour is congested.
    - cron: "17 13 * * 1"
  workflow_dispatch:

# Least privilege by default; each job widens only what it needs.
permissions: {}

jobs:
  pins:
    name: AMI and add-on pins
    runs-on: ubuntu-latest
    # This is a template repo; the cluster isn't real here, so don't run against
    # it. Repos created from the template have a different name, so the workflow
    # runs normally for them.
    if: github.repository != 'devopscoop/aws-eks-template'
    permissions:
      id-token: write # assume the deploy role via OIDC
      contents: write # push the bump branch
      pull-requests: write # open the PR
    steps:
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          # This will be overwritten with the correct region by quickstart.sh.
          aws-region: us-east-2
          # This must be manually updated to our actual ARN.
          role-to-assume: arn:aws:iam::999999999999:role/github-actions-dev-tf-Role-REDACTED
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          # The scripts finish with `tofu fmt` on the tfvars file, so tofu has to
          # be on PATH. Same version file as the deploy workflow.
          tofu_version_file: cluster/.opentofu-version
      - name: Bump the AMI and add-on pins
        run: |
          cd cluster
          ./update_node_ami.sh
          ./update_eks_addons.sh
      # Opens a PR only when a script actually changed something, and reuses the
      # same branch on later runs rather than stacking up near-identical PRs.
      #
      # Note on the token: a PR opened with the default GITHUB_TOKEN does not
      # trigger other workflows, so the opentofu plan would not run on it and
      # the whole point of getting a plan to review would be lost. Set a
      # VERSION_BUMP_TOKEN secret (a PAT or GitHub App token with contents and
      # pull-requests write) to get the plan comment. Without it this still
      # works, but you will have to push an empty commit to the branch to
      # trigger the plan.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.VERSION_BUMP_TOKEN || github.token }}
          branch: automation/eks-version-pins
          delete-branch: true
          add-paths: cluster/*.tfvars
          commit-message: "Bump the EKS AMI and add-on version pins"
          title: "Bump the EKS AMI and add-on version pins"
          body: |
            Opened automatically by `.github/workflows/update-eks-versions.yml`.

            `cluster/update_node_ami.sh` and `cluster/update_eks_addons.sh` found
            newer versions for the current `cluster_version`. Both stay within
            the same Kubernetes minor, so this is routine drift rather than an
            upgrade — no ordering constraints against the control plane.

            **Read the plan before merging.** A change to
            `node_ami_release_version` rotates every managed node, which drains
            the databases one instance at a time and takes tens of minutes.

            If no `tofu plan` comment appeared, this PR was opened with the
            default `GITHUB_TOKEN`, which cannot trigger other workflows — see
            the comment on this step in the workflow.

  kubernetes-version:
    name: Kubernetes minor
    runs-on: ubuntu-latest
    if: github.repository != 'devopscoop/aws-eks-template'
    permissions:
      id-token: write # assume the deploy role via OIDC
      contents: read
      issues: write # file the upgrade reminder
    steps:
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          # This will be overwritten with the correct region by quickstart.sh.
          aws-region: us-east-2
          # This must be manually updated to our actual ARN.
          role-to-assume: arn:aws:iam::999999999999:role/github-actions-dev-tf-Role-REDACTED
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        name: Compare cluster_version against what EKS offers
        # How many days of standard support left before this is worth filing.
        # EKS gives ~14 months per minor, so 90 days is late enough not to nag
        # and early enough to leave room for one minor at a time.
        env:
          EOL_WARNING_DAYS: "90"
        run: |
          set -Eeuo pipefail

          # Same tfvars discovery as the update_*.sh scripts: forks rename the
          # file, so find it by content rather than by name.
          tfvars_file=$(grep -lE '^cluster_version' cluster/*.tfvars || true)
          if [ "$(wc -l <<< "$tfvars_file")" -ne 1 ] || [ -z "$tfvars_file" ]; then
            echo "error: expected exactly one cluster/*.tfvars with a cluster_version pin, got:" >&2
            echo "$tfvars_file" >&2
            exit 1
          fi
          current=$(sed -nE "s/^cluster_version[^=]*=[ \t]+['\"]?([^'\"]+)['\"]?/\1/p" "$tfvars_file")

          aws eks describe-cluster-versions --output json > "$RUNNER_TEMP/versions.json"

          # Sort numerically by component; a lexical sort puts 1.9 above 1.10.
          latest=$(jq -r '[.clusterVersions[].clusterVersion]
            | sort_by(split(".") | map(tonumber)) | last' "$RUNNER_TEMP/versions.json")
          eol=$(jq -r --arg v "$current" '.clusterVersions[]
            | select(.clusterVersion == $v) | .endOfStandardSupportDate // empty' "$RUNNER_TEMP/versions.json")

          days_left=""
          if [ -n "$eol" ]; then
            days_left=$(( ( $(date -u -d "$eol" +%s) - $(date -u +%s) ) / 86400 ))
          fi

          behind=false
          [ "$current" != "$latest" ] && behind=true
          expiring=false
          [ -n "$days_left" ] && [ "$days_left" -le "$EOL_WARNING_DAYS" ] && expiring=true

          {
            echo "current=$current"
            echo "latest=$latest"
            echo "days_left=$days_left"
            echo "should_file=$([ "$behind" = true ] || [ "$expiring" = true ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

          echo "cluster_version=$current latest=$latest days_of_support_left=${days_left:-unknown}"
      - name: File or refresh the upgrade issue
        if: steps.check.outputs.should_file == 'true'
        # Values reach the script as environment variables rather than inline
        # ${{ }} interpolation, for the template-injection reason spelled out in
        # the opentofu workflow.
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
          DAYS_LEFT: ${{ steps.check.outputs.days_left }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          title="Upgrade EKS from ${CURRENT} to ${LATEST}"

          # One open issue per target version; refreshing beats a weekly pile.
          existing=$(gh issue list --repo "$REPO" --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "already tracked in #${existing}"
            exit 0
          fi

          cat > "$RUNNER_TEMP/issue.md" <<EOF
          \`cluster_version\` is \`${CURRENT}\`; EKS now offers \`${LATEST}\`. Standard
          support for \`${CURRENT}\` has **${DAYS_LEFT} days** left.

          Opened automatically by \`.github/workflows/update-eks-versions.yml\`. This is a
          reminder, not a plan — a minor upgrade needs judgement, and EKS only moves one
          minor at a time.

          Order, per [the AWS upgrade steps](https://docs.aws.amazon.com/eks/latest/userguide/update-cluster.html):

          1. Review EKS upgrade insights for deprecated API usage, and read the release
             notes for the target minor.
          2. Bump \`cluster_version\` **and** \`node_ami_release_version\` together
             (run \`./update_node_ami.sh\` after editing \`cluster_version\`). One PR:
             the eks module sequences the control plane ahead of the node groups, and a
             node group cannot take an AMI release from a different minor.
          3. Then \`./update_eks_addons.sh\` as a follow-up PR — AWS puts add-ons after
             the data plane.

          Expect step 2 to rotate every managed node, draining the databases one instance
          at a time.
          EOF

          gh issue create --repo "$REPO" --title "$title" \
            --body-file "$RUNNER_TEMP/issue.md"
