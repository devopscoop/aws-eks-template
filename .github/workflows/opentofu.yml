# Based on:
# https://github.com/opentofu/setup-opentofu

# When we create a pull request (PR) to the main branch, this workflow runs `tofu plan`, and adds the output as a comment to the PR. If the plan looks good, we merge (ie. push) the code to the main branch. On push to main, this runs a `tofu apply`.
on:
  push:
    branches:
      - main
    paths:
      - cluster/**
  pull_request:
    branches:
      - main
    paths:
      - cluster/**
defaults:
  run:
    working-directory: cluster
permissions:
  id-token: write
  contents: read
  pull-requests: write
jobs:
  opentofu:
    runs-on: ubuntu-latest
    steps:

      # If this workflow is running in template repo, use LocalStack to test it.
      - if: github.repository == 'devopscoop/aws-eks-template'
        uses: LocalStack/setup-localstack@7c8a0cb3405bc58be4c8f763f812aa000bc46303 # v0.3.2
      - if: github.repository == 'devopscoop/aws-eks-template'
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-access-key-id: test
          aws-secret-access-key: test
          aws-region: us-east-1

      - if: github.repository != 'devopscoop/aws-eks-template'
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          # This will be overwritten with the correct region by quickstart.sh.
          aws-region: us-east-2
          # This must be manually updated to our actual ARN.
          role-to-assume: arn:aws:iam::999999999999:role/github-actions-dev-tf-Role-REDACTED
      # persist-credentials must remain true (the default) so that tofu init can
      # use the GitHub token to clone module sources specified as git:// URLs.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
      # https://github.com/magnetikonline/terraform-github-action-cache-example
      - name: Configure Terraform plugin cache
        run: |
          echo "TF_PLUGIN_CACHE_DIR=$HOME/.terraform.d/plugin-cache" >>"$GITHUB_ENV"
          mkdir --parents "$HOME/.terraform.d/plugin-cache"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.terraform.d/plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-${{ runner.os }}-
      - id: fmt
        run: tofu fmt -recursive -check
        continue-on-error: true
      - id: init
        run: tofu init
      - id: validate
        run: tofu validate -no-color 2>&1 | tee validate-output.txt
      # Adding this because module.eks_blueprints_addons.module.aws_efs_csi_driver.helm_release.this[0] requires the AWS CLI.
      # https://docs.aws.amazon.com/cli/latest/userguide/getting-started-version.html
      - name: Install AWS CLI v2
        run: |
          if ! command -v aws &>/dev/null; then
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.28.16.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            ./aws/install
          fi
      - id: plan
        run: |
          tofu plan -no-color -input=false -out=plan.file 2>&1 | tee plan-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >>"$GITHUB_ENV"
        continue-on-error: true
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        if: github.event_name == 'pull_request'
        env:
          WORKSPACE: ${{ github.workspace }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          EXIT_CODE: ${{ env.exit_code }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.workflow }}
          TF_WORKING_DIR: ${{ env.tf_actions_working_dir }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const wd = path.join(process.env.WORKSPACE, 'cluster');
            const planOutput = fs.readFileSync(path.join(wd, 'plan-output.txt'), 'utf8');
            const validateOutput = fs.readFileSync(path.join(wd, 'validate-output.txt'), 'utf8');
            const planStatus = process.env.EXIT_CODE === '0' ? 'success' : 'failure';
            const body = [
              `#### OpenTofu Format and Style: \`${process.env.FMT_OUTCOME}\``,
              `#### OpenTofu Initialization: \`${process.env.INIT_OUTCOME}\``,
              `#### OpenTofu Validation: \`${process.env.VALIDATE_OUTCOME}\``,
              "",
              "<details><summary>Validation Output</summary>",
              "",
              "```",
              validateOutput,
              "```",
              "",
              "</details>",
              "",
              `#### OpenTofu Plan: \`${planStatus}\``,
              "",
              "<details><summary>Show Plan</summary>",
              "",
              "```",
              "tofu",
              planOutput,
              "```",
              "",
              "</details>",
              "",
              `*Pusher: @${process.env.ACTOR}, Action: \`${process.env.EVENT_NAME}\`, Working Directory: \`${process.env.TF_WORKING_DIR}\`, Workflow: \`${process.env.WORKFLOW_NAME}\`*`
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
      - if: github.ref == 'refs/heads/main'
        run: tofu apply -no-color -input=false plan.file
